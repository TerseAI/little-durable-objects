syntax = "proto3";

package durable_object.v1;

service ActorHostService {
  rpc Invoke(HostInvokeActorRequest) returns (InvokeActorReply);
}

service ActorControlPlaneService {
  rpc Invoke(InvokeActorRequest) returns (InvokeActorReply);
  rpc Execute(ControlPlaneRequest) returns (ControlPlaneReply);
}

service ActorAdminService {
  rpc EnsureNamespace(EnsureNamespaceRequest) returns (EnsureNamespaceReply);
  rpc RegisterLaunchSpec(RegisterLaunchSpecRequest) returns (RegisterLaunchSpecReply);
  rpc IssueWorkflowToken(IssueWorkflowTokenRequest) returns (IssueWorkflowTokenReply);
  rpc GetJwks(GetJwksRequest) returns (GetJwksReply);
}

message EnsureNamespaceRequest {
  string namespace_id = 1;
}

message EnsureNamespaceReply {
  bool created = 1;
}

message RegisterLaunchSpecRequest {
  string namespace_id = 1;
  string code_revision = 2;
  string image_ref = 3;
  string working_directory = 4;
  optional string actor_entrypoint = 5;
}

message RegisterLaunchSpecReply {
  bool created = 1;
}

message IssueWorkflowTokenRequest {
  string namespace_id = 1;
  string execution_id = 2;
  int64 deadline_unix_ms = 5;
}

message IssueWorkflowTokenReply {
  string token = 1;
  int64 expires_at_ms = 2;
}

message GetJwksRequest {}

message GetJwksReply {
  bytes jwks_json = 1;
}

message ControlPlaneRequest {
  bytes command_json = 1;
}

message ControlPlaneReply {
  bytes reply_json = 1;
}

message ActorKey {
  string namespace_id = 1;
  string actor_type = 2;
  string actor_id = 3;
}

message InvokeActorRequest {
  string request_id = 1;
  ActorKey actor = 2;
  string method = 3;
  bytes args_json = 4;
  uint64 timeout_ms = 5;
}

message HostInvokeActorRequest {
  InvokeActorRequest invocation = 1;
  uint64 owner_epoch = 2;
  string state_read_url = 3;
}

message InvokeActorReply {
  oneof result {
    ActorCompleted completed = 1;
    ActorFailed failed = 2;
    Reroute reroute = 3;
  }
}

message ActorCompleted {
  bytes result_json = 1;
}

message ActorFailed {
  string code = 1;
  string message = 2;
}

message Reroute {}
