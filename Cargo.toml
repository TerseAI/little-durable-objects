[package]
name = "little-durable-objects"
version = "0.1.4"
edition = "2024"
rust-version = "1.89"
default-run = "little-durable-objects"
description = "Standalone regional durable-object control plane, host, and durability runtime"
readme = "README.md"
repository = "https://github.com/TerseAI/little-durable-objects"
license = "MIT"
keywords = ["actors", "distributed-systems", "durable-objects", "serverless"]
categories = ["asynchronous", "network-programming"]
include = ["/src/**", "/tests/**", "/proto/**", "/migrations/**", "/build.rs", "/README.md", "/LICENSE.md"]

[dependencies]
axum = "0.8"
bytes = "1"
prost = "0.14"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["net"] }
tokio-util = { version = "0.7", features = ["rt"] }
tonic = { version = "0.14", features = ["tls-aws-lc", "tls-webpki-roots"] }
tonic-prost = "0.14"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
google-cloud-storage = { version = "1.17.0", features = ["unstable-stream"] }
google-cloud-auth = "1.15.0"
anyhow = "1.0.104"
async-trait = "0.1.92"
aws-lc-rs = { version = "1.18.0", default-features = false, features = ["non-fips"] }
base64 = "0.22.1"
jsonwebtoken = { version = "10.4", default-features = false, features = ["aws_lc_rs"] }
refinery = { version = "0.9.2", features = ["tokio-postgres"] }
subtle = "2.6"
uuid = { version = "1", features = ["v4"] }
native-tls = "0.2"
postgres-native-tls = "0.5"
tokio-postgres = "0.7"
tempfile = "3"

[build-dependencies]
protoc-bin-vendored = "3"
tonic-prost-build = "0.14"
