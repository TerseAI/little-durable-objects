name: Release

on:
    release:
        types: [published]

concurrency:
    group: release
    cancel-in-progress: false

permissions:
    contents: read

env:
    REGISTRY: us-central1-docker.pkg.dev
    IMAGE: us-central1-docker.pkg.dev/fluid-analogy-473415-c2/public/little-durable-objects

jobs:
    preflight:
        name: Preflight
        if: github.event.release.prerelease == false
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.version.outputs.version }}
        steps:
            - name: Read release version
              id: version
              env:
                  TAG: ${{ github.event.release.tag_name }}
              run: |
                  if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                      echo "::error::Tag must look like v1.2.3 (got '$TAG')"
                      exit 1
                  fi
                  echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

            - name: Checkout the tagged commit
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  ref: ${{ github.sha }}
                  fetch-depth: 0

            - name: Assert the tagged commit is on main
              run: |
                  git fetch --quiet origin main
                  if ! git merge-base --is-ancestor "${{ github.sha }}" origin/main; then
                      echo "::error::${{ github.sha }} is not an ancestor of origin/main"
                      exit 1
                  fi

            - name: Assert every manifest matches the tag
              run: node scripts/release.mjs verify "${{ steps.version.outputs.version }}"

    rust:
        name: Test Rust runtime
        needs: preflight
        runs-on: ubuntu-24.04
        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_DB: durable_objects_test
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_USER: postgres
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres -d durable_objects_test"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
        steps:
            - name: Checkout the tagged commit
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  ref: ${{ github.sha }}

            - name: Install Rust toolchain
              run: rustup toolchain install 1.89.0 --profile minimal --component rustfmt && rustup default 1.89.0

            - name: Check formatting
              run: cargo fmt --all -- --check

            - name: Run tests
              env:
                  DURABLE_OBJECT_TEST_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/durable_objects_test?sslmode=disable
              run: cargo test --locked --no-fail-fast

            - name: Verify crate package
              run: cargo publish --locked --dry-run

    npm-ci:
        name: Test npm package
        needs: preflight
        runs-on: ubuntu-24.04
        steps:
            - name: Checkout the tagged commit
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  ref: ${{ github.sha }}

            - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
              with:
                  version: 10.17.1

            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: "22.19.0"
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Check formatting
              run: pnpm --dir npm format:check

            - name: Run tests
              run: pnpm --dir npm test

            - name: Verify npm package
              working-directory: npm
              run: npm pack --dry-run

    image-build:
        name: Build runtime image (${{ matrix.arch }})
        needs: [preflight, rust, npm-ci]
        strategy:
            fail-fast: false
            matrix:
                include:
                    - arch: amd64
                      platform: linux/amd64
                      runner: blacksmith-4vcpu-ubuntu-2404
                    - arch: arm64
                      platform: linux/arm64
                      runner: blacksmith-4vcpu-ubuntu-2404-arm
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 60
        permissions:
            contents: read
            id-token: write
        steps:
            - name: Checkout the tagged commit
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  ref: ${{ github.sha }}

            - name: Authenticate to Google Cloud
              uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
              with:
                  project_id: fluid-analogy-473415-c2
                  workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}

            - name: Set up gcloud
              uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1

            - name: Configure Docker for Artifact Registry
              run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

            - name: Set up Blacksmith Docker builder
              uses: useblacksmith/setup-docker-builder@a5256a73e30f09e37e3eceb8ca36043d17621d24 # v2.1.0
              with:
                  cache-key: little-durable-objects/runtime-${{ matrix.arch }}
                  nofallback: true
                  platforms: ${{ matrix.platform }}

            - name: Build and push
              uses: useblacksmith/build-push-action@9b0579bbec7a6cad2f171596c57e7ac1e7658850 # v2.3.0
              with:
                  context: .
                  platforms: ${{ matrix.platform }}
                  push: true
                  tags: ${{ env.IMAGE }}:${{ needs.preflight.outputs.version }}-${{ matrix.arch }}
                  labels: |
                      org.opencontainers.image.source=https://github.com/TerseAI/little-durable-objects
                      org.opencontainers.image.revision=${{ github.sha }}
                      org.opencontainers.image.version=${{ needs.preflight.outputs.version }}
                      org.opencontainers.image.licenses=MIT

    image:
        name: Publish runtime image
        needs: [preflight, image-build]
        runs-on: blacksmith-2vcpu-ubuntu-2404
        timeout-minutes: 10
        permissions:
            attestations: write
            contents: read
            id-token: write
        steps:
            - name: Authenticate to Google Cloud
              uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
              with:
                  project_id: fluid-analogy-473415-c2
                  workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}

            - name: Set up gcloud
              uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1

            - name: Configure Docker for Artifact Registry
              run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

            - name: Read Artifact Registry access token
              id: registry
              run: |
                  token="$(gcloud auth print-access-token)"
                  echo "::add-mask::$token"
                  echo "token=$token" >> "$GITHUB_OUTPUT"

            - name: Sign in for provenance upload
              uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
              with:
                  registry: ${{ env.REGISTRY }}
                  username: oauth2accesstoken
                  password: ${{ steps.registry.outputs.token }}

            - name: Publish multi-platform manifest
              id: manifest
              env:
                  VERSION: ${{ needs.preflight.outputs.version }}
              run: |
                  set -euo pipefail
                  docker buildx imagetools create \
                    --tag "${IMAGE}:${VERSION}" \
                    --tag "${IMAGE}:latest" \
                    "${IMAGE}:${VERSION}-amd64" \
                    "${IMAGE}:${VERSION}-arm64"
                  inspection="$(docker buildx imagetools inspect "${IMAGE}:${VERSION}")"
                  digest="$(awk '/^Digest:/ { print $2; exit }' <<< "$inspection")"
                  if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                      echo "::error::Could not resolve the published manifest digest"
                      exit 1
                  fi
                  echo "digest=${digest}" >> "$GITHUB_OUTPUT"

            - name: Attest image provenance
              uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
              with:
                  subject-name: ${{ env.IMAGE }}
                  subject-digest: ${{ steps.manifest.outputs.digest }}
                  push-to-registry: true

    npm:
        name: Publish npm package
        needs: [preflight, image]
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: read
            id-token: write
        steps:
            - name: Checkout the tagged commit
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  ref: ${{ github.sha }}

            - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
              with:
                  version: 10.17.1

            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: "22.19.0"
                  registry-url: "https://registry.npmjs.org"

            - name: Install trusted-publishing npm version
              run: npm install -g npm@11.9.0

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Pack tarball
              run: |
                  mkdir -p dist-tarballs
                  pnpm --dir npm pack --pack-destination "$PWD/dist-tarballs"

            - name: Publish to npm
              env:
                  RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
              run: |
                  if npm view "little-durable-objects@$RELEASE_VERSION" version >/dev/null 2>&1; then
                      echo "little-durable-objects@$RELEASE_VERSION already published"
                  else
                      npm publish dist-tarballs/*.tgz --access public
                  fi

    crate:
        name: Publish crate
        needs: [preflight, npm]
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        steps:
            - name: Checkout the tagged commit
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  ref: ${{ github.sha }}

            - name: Install Rust toolchain
              run: rustup toolchain install 1.89.0 --profile minimal && rustup default 1.89.0

            - name: Publish to crates.io
              env:
                  CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
                  RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
              run: |
                  status=$(curl -sS \
                    --user-agent "little-durable-objects-release/1.0 (+https://github.com/TerseAI/little-durable-objects)" \
                    -o /dev/null \
                    -w "%{http_code}" \
                    "https://crates.io/api/v1/crates/little-durable-objects/$RELEASE_VERSION")
                  if [ "$status" = "200" ]; then
                      echo "little-durable-objects@$RELEASE_VERSION already published"
                  elif [ "$status" = "404" ]; then
                      cargo publish --locked
                  else
                      echo "::error::crates.io returned HTTP $status"
                      exit 1
                  fi
