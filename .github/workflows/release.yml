name: Release

on:
    release:
        types: [published]

concurrency:
    group: release
    cancel-in-progress: false

permissions:
    contents: read

env:
    IMAGE: ghcr.io/terseai/lil-durable-objects

jobs:
    preflight:
        name: Preflight
        if: github.event.release.prerelease == false
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.version.outputs.version }}
        steps:
            - name: Read release version
              id: version
              env:
                  TAG: ${{ github.event.release.tag_name }}
              run: |
                  if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                      echo "::error::Tag must look like v1.2.3 (got '$TAG')"
                      exit 1
                  fi
                  echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

            - name: Checkout the tagged commit
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  ref: ${{ github.sha }}
                  fetch-depth: 0

            - name: Assert the tagged commit is on main
              run: |
                  git fetch --quiet origin main
                  if ! git merge-base --is-ancestor "${{ github.sha }}" origin/main; then
                      echo "::error::${{ github.sha }} is not an ancestor of origin/main"
                      exit 1
                  fi

            - name: Assert every manifest matches the tag
              run: node scripts/release.mjs verify "${{ steps.version.outputs.version }}"

    rust:
        name: Test Rust runtime
        needs: preflight
        runs-on: ubuntu-24.04
        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_DB: durable_objects_test
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_USER: postgres
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres -d durable_objects_test"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
        steps:
            - name: Checkout the tagged commit
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  ref: ${{ github.sha }}

            - name: Install Rust toolchain
              run: rustup toolchain install 1.89.0 --profile minimal --component rustfmt && rustup default 1.89.0

            - name: Check formatting
              run: cargo fmt --all -- --check

            - name: Run tests
              env:
                  DURABLE_OBJECT_TEST_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/durable_objects_test?sslmode=disable
              run: cargo test --locked --no-fail-fast

            - name: Verify crate package
              run: cargo publish --locked --dry-run

    npm-ci:
        name: Test npm package
        needs: preflight
        runs-on: ubuntu-24.04
        steps:
            - name: Checkout the tagged commit
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  ref: ${{ github.sha }}

            - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
              with:
                  version: 10.17.1

            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: "22.19.0"
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Check release tooling
              run: node --test scripts/release.test.mjs

            - name: Check formatting
              run: pnpm --dir npm format:check

            - name: Run tests
              run: pnpm --dir npm test

            - name: Verify npm package
              working-directory: npm
              run: npm pack --dry-run

    image:
        name: Publish runtime image
        needs: [preflight, rust, npm-ci]
        runs-on: ubuntu-24.04
        timeout-minutes: 60
        permissions:
            contents: read
            packages: write
        steps:
            - name: Checkout the tagged commit
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  ref: ${{ github.sha }}

            - name: Sign in to GitHub Container Registry
              uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Set up QEMU
              uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
              with:
                  platforms: linux/amd64,linux/arm64

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

            - name: Build and push
              uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
              with:
                  context: .
                  platforms: linux/amd64,linux/arm64
                  push: true
                  tags: |
                      ${{ env.IMAGE }}:${{ needs.preflight.outputs.version }}
                      ${{ env.IMAGE }}:latest
                  labels: |
                      org.opencontainers.image.source=https://github.com/TerseAI/lil-durable-objects
                      org.opencontainers.image.revision=${{ github.sha }}
                      org.opencontainers.image.version=${{ needs.preflight.outputs.version }}
                      org.opencontainers.image.licenses=MIT
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

    npm:
        name: Publish npm package
        needs: [preflight, image]
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: read
            id-token: write
        steps:
            - name: Checkout the tagged commit
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  ref: ${{ github.sha }}

            - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
              with:
                  version: 10.17.1

            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: "22.19.0"
                  registry-url: "https://registry.npmjs.org"

            - name: Install trusted-publishing npm version
              run: npm install -g npm@11.9.0

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Pack tarball
              run: |
                  mkdir -p dist-tarballs
                  pnpm --dir npm pack --pack-destination "$PWD/dist-tarballs"

            - name: Publish to npm
              env:
                  RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
              run: |
                  if npm view "lil-durable-objects@$RELEASE_VERSION" version >/dev/null 2>&1; then
                      echo "lil-durable-objects@$RELEASE_VERSION already published"
                  else
                      npm publish dist-tarballs/*.tgz --access public
                  fi

    crate:
        name: Publish crate
        needs: [preflight, npm]
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        steps:
            - name: Checkout the tagged commit
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
              with:
                  ref: ${{ github.sha }}

            - name: Install Rust toolchain
              run: rustup toolchain install 1.89.0 --profile minimal && rustup default 1.89.0

            - name: Publish to crates.io
              env:
                  CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
                  RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
              run: |
                  status=$(curl -sS -o /dev/null -w "%{http_code}" "https://crates.io/api/v1/crates/durable-object-runtime/$RELEASE_VERSION")
                  if [ "$status" = "200" ]; then
                      echo "durable-object-runtime@$RELEASE_VERSION already published"
                  elif [ "$status" = "404" ]; then
                      cargo publish --locked
                  else
                      echo "::error::crates.io returned HTTP $status"
                      exit 1
                  fi
